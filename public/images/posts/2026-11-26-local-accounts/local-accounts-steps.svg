<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="Inter, 'DejaVu Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#004567" />
      <stop offset="1" stop-color="#003854" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5e0" />
    </marker>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#bg)" />

  <g stroke="#60a5e0" stroke-width="4" marker-end="url(#arrow)">
    <line x1="235" y1="150" x2="362" y2="150" />
    <line x1="535" y1="150" x2="662" y2="150" />
    <line x1="835" y1="150" x2="962" y2="150" />
  </g>

  <g fill="none" stroke="#9ec4e3" stroke-width="3">
    <circle cx="150" cy="150" r="72" /><circle cx="450" cy="150" r="72" />
    <circle cx="750" cy="150" r="72" /><circle cx="1050" cy="150" r="72" />
  </g>

  <!-- 1 mail to DHinfra -->
  <g transform="translate(150 150)" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">
    <rect x="-38" y="-26" width="76" height="52" rx="6" />
    <polyline points="-38,-26 0,6 38,-26" />
  </g>
  <!-- 2 invitation, 7 days -->
  <g transform="translate(450 150)">
    <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">
      <rect x="-38" y="-22" width="76" height="52" rx="6" />
      <polyline points="-38,-22 0,10 38,-22" />
    </g>
    <circle cx="34" cy="-28" r="22" fill="#60a5e0" />
    <text x="34" y="-21" text-anchor="middle" font-size="19" font-weight="700" fill="#003854">7d</text>
  </g>
  <!-- 3 sign up with authenticator -->
  <g transform="translate(750 150)">
    <rect x="-26" y="-44" width="52" height="88" rx="9" fill="none" stroke="#ffffff" stroke-width="4" />
    <line x1="-8" y1="34" x2="8" y2="34" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <text x="0" y="-4" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">482</text>
    <text x="0" y="16" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">913</text>
  </g>
  <!-- 4 account switched on -->
  <g transform="translate(1050 150)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle r="36" />
    <polyline points="-16,1 -4,13 18,-11" />
  </g>

  <g font-weight="700" font-size="20" fill="#003854" text-anchor="middle">
    <circle cx="98" cy="98" r="20" fill="#60a5e0" /><text x="98" y="105">1</text>
    <circle cx="398" cy="98" r="20" fill="#60a5e0" /><text x="398" y="105">2</text>
    <circle cx="698" cy="98" r="20" fill="#60a5e0" /><text x="698" y="105">3</text>
    <circle cx="998" cy="98" r="20" fill="#60a5e0" /><text x="998" y="105">4</text>
  </g>

  <g text-anchor="middle">
    <g font-size="27" font-weight="700" fill="#ffffff">
      <text x="150" y="276">Get in touch</text>
      <text x="450" y="276">Invitation by mail</text>
      <text x="750" y="276">Sign up</text>
      <text x="1050" y="276">Account active</text>
    </g>
    <g font-size="21" fill="#9ec4e3">
      <text x="150" y="312">your project lead</text><text x="150" y="340">writes to us, or you do</text>
      <text x="450" y="312">for your address only,</text><text x="450" y="340">valid for 7 days</text>
      <text x="750" y="312">password, authenticator</text><text x="750" y="340">app, 10 backup codes</text>
      <text x="1050" y="312">switched on</text><text x="1050" y="340">after our check</text>
    </g>
  </g>
</svg>
