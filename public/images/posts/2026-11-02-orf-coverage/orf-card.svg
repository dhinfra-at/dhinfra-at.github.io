      <stop offset="0" stop-color="#004567" />
      <stop offset="1" stop-color="#003854" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="14" height="675" fill="#60a5e0" />

  <text x="90" y="290" font-size="92" font-weight="700" fill="#ffffff">DHinfra.at</text>
  <circle cx="106" cy="370" r="14" fill="#ff5a5f" />
