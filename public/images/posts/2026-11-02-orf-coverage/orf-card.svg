<!--
  Post card. Colours are the brand tokens of src/assets/images/dhinfra-og.svg; icons are
  tabler device-tv and radio. Inter must be installed to render this.

  Regenerate the PNG after editing:
    node -e "require('sharp')('public/images/posts/2026-11-02-orf-coverage/orf-card.svg',{density:72})
      .resize(1200,675).png().toFile('public/images/posts/2026-11-02-orf-coverage/orf-card.png')"
-->
