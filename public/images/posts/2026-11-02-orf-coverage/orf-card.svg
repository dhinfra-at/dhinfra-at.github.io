  <text x="146" y="384" font-size="40" font-weight="600" letter-spacing="6" fill="#d6e6f4">ON AIR</text>
  <text x="92" y="596" font-size="30" fill="#9ec4e3">Ö1 and ORF 2</text>

  <g transform="translate(640 96) scale(11)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
