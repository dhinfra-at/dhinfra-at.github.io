<!--
  Social preview card (Open Graph), referenced as dhinfra-og.png from src/config.yaml.
  Colours are the brand tokens: #004567 is aw-color-primary in CustomStyles.astro and
  dh-topbar-bg in the console, #003854 is aw-color-secondary, #60a5e0 is the dark-mode
  aw-color-primary. Inter is the site typeface and must be installed to render this.

  Regenerate the PNG after editing:
    node -e "require('sharp')('src/assets/images/dhinfra-og.svg',{density:72})
      .resize(1200,630).png().toFile('src/assets/images/dhinfra-og.png')"
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter, 'DejaVu Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#004567" />
      <stop offset="1" stop-color="#003854" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="14" height="630" fill="#60a5e0" />

  <text x="98" y="292" font-size="108" font-weight="700" fill="#ffffff">DHinfra.at</text>
  <text x="100" y="388" font-size="42" fill="#d6e6f4">
    <tspan x="100">Shared infrastructure for</tspan>
    <tspan x="100" dy="56">Digital Humanities in Austria</tspan>
  </text>
  <text x="100" y="556" font-size="30" fill="#9ec4e3">A CLARIAH-AT initiative</text>
</svg>
